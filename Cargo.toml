[package]
name = "dirgal"
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
authors = ["Zak Nesler"]
repository = "https://github.com/zaknesler/dirgal"
license = "GPL-3.0-or-later"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
directories = "6.0"
dirs = "7.0"
figment = { version = "0.10", features = ["toml"] }
futures = "0.3"
gpui-kit = { version = "0.6", features = ["assets"] }
humansize = "2.1"
ignore = "0.4"
image = "0.25"
indicatif = { version = "0.18", features = ["rayon"] }
kamadak-exif = "0.6"
natord = "1.0"
num-format = "0.4"
postcard = { version = "1.1", features = ["alloc"] }
rayon = "1"
regex = "1.13"
rust-embed = "8.11"
schemars = "1.2"
seahash = "4.1"
serde = { version = "1.0", features = ["derive"] }
strum = { version = "0.28", features = ["derive"] }
thiserror = "2.0"
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
trash = "5.2"

[profile.release]
strip = true
opt-level = "s"
lto = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
